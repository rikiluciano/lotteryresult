<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora De Jugadas de Loterías</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
        /* ===========================================
           FOOTER
           =========================================== */
        footer {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--background-dark) 100%);
            color: var(--text-light);
            text-align: center;
            padding: var(--spacing-lg);
            margin-top: var(--spacing-xl);
        }


        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .footer-content p {
            margin-bottom: var(--spacing-xs);
        }
         .signature-animated {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
    border-radius: 8px;
    border: 1px solid #e0e0e0;
    transition: all 0.3s ease;
    width: 80%;
    max-width: 80%;
    margin: 0 auto;
}


.signature-animated:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 212, 255, 0.2);
}


.logo-animated {
    width: 35px;
    height: 35px;
    background: linear-gradient(45deg, #00d4ff, #7c3aed);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 14px;
    transition: all 0.3s ease;
}


.signature-animated:hover .logo-animated {
    transform: rotate(5deg) scale(1.1);
}
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <header class="bg-gradient-to-r from-teal-500 via-purple-500 to-indigo-500 p-6 text-center shadow-lg">
    <h1 class="text-3xl font-extrabold tracking-wide uppercase">Calculadora De Jugadas de Loterías</h1>
  </header>

  <main class="flex-grow container mx-auto p-4">
    <form id="formulario" class="bg-gray-800 p-6 rounded-xl shadow-xl space-y-4 max-w-xl mx-auto">
      <div>
        <label class="font-semibold">Tipo de Juego:</label>
        <select id="tipoJuego" name="tipoJuego" class="mt-2 w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-teal-400">
          <option value="72" data-nombre="Quiniela">Quiniela</option>
          <option value="1500" data-nombre="Palé">Palé</option>
          <option value="3000" data-nombre="Súper Palé">Súper Palé</option>
          <option value="20000" data-nombre="Tripleta">Tripleta</option>
        </select>
      </div>
      <div>
        <label class="font-semibold">Días a jugar:</label>
        <input type="number" id="dias" name="dias" min="1" required class="mt-2 w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-teal-400">
      </div>
      <div>
        <label class="font-semibold">Monto Inicial a Jugar:</label>
        <input type="number" id="montoInicial" name="montoInicial" min="0.01" step="0.01" value="1" required class="mt-2 w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-teal-400">
      </div>
      <div>
        <label class="font-semibold">Modo de Cálculo:</label>
        <select id="modoCalculo" name="modoCalculo" class="mt-2 w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-teal-400">
          <option value="martingala">Martingala (Multiplica la inversion diariamente)</option>
          <option value="gananciaDiaria">Ganancia Fija Diaria</option>
        </select>
      </div>
      <div id="campoMartingala">
        <label class="font-semibold">Martingala (Multiplicador):</label>
        <input type="number" id="martingala" name="martingala" min="1" class="mt-2 w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-teal-400">
      </div>
      <div>
        <label class="font-semibold" id="labelCantidadNumeros">Cantidad de Números:</label>
        <input type="number" id="cantidadNumeros" name="cantidadNumeros" min="1" required class="mt-2 w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-teal-400">
      </div>
      <div>
        <label class="font-semibold">Cantidad de Loterías:</label>
        <input type="number" id="cantidadLoterias" name="cantidadLoterias" min="1" required class="mt-2 w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-teal-400">
      </div>
      <div class="flex gap-3">
        <button type="submit" class="bg-teal-500 hover:bg-teal-400 text-gray-900 font-bold py-2 px-4 rounded-xl transition flex-1">Calcular</button>
        <button type="button" id="btnNuevoCalculo" class="bg-red-500 hover:bg-red-400 text-white font-bold py-2 px-4 rounded-xl transition flex-1">Nuevo Cálculo</button>
      </div>
    </form>

    <section id="resultado" class="mt-8 hidden">
      <div class="bg-gray-800 p-6 rounded-xl shadow-xl">
        <h2 class="text-2xl font-bold text-teal-400 mb-4">Resumen General</h2>
        <p id="resumenCapital" class="mb-4 text-lg"></p>
        <div id="tablaResultados" class="space-y-6"></div>
      </div>
    </section>
  </main>

    <footer>
        <div class="footer-content">
            <p>&copy; <span id="current-year"></span> Calculadora De Jugadas De Loterías<br>Todos los derechos reservados.</p>
            <div class="signature-animated">
    <div class="logo-animated">R</div>
    <div>
        <div style="font-weight: bold; color: #333;">RLabs</div>
        <div style="font-size: 12px; color: #666;">Desarrollo Web</div>
    </div>
</div>
        </div>
    </footer>
    <script>
        // Obtener el año actual y actualizar el footer
        const currentYear = new Date().getFullYear();
        document.getElementById('current-year').textContent = currentYear;
        
        // Opcional: Actualizar el año cada minuto (por si la página queda abierta durante el cambio de año)
        setInterval(() => {
            const newYear = new Date().getFullYear();
            document.getElementById('current-year').textContent = newYear;
        }, 60000); // Actualiza cada minuto
    </script>

  <script>
    const selectJuego = document.getElementById('tipoJuego');
    const labelCantidad = document.getElementById('labelCantidadNumeros');
    const cantidadNumerosInput = document.getElementById('cantidadNumeros');
    const modoCalculo = document.getElementById('modoCalculo');
    const campoMartingala = document.getElementById('campoMartingala');
    const btnNuevoCalculo = document.getElementById('btnNuevoCalculo');

    function actualizarEtiqueta() {
      const selected = selectJuego.options[selectJuego.selectedIndex];
      const nombre = selected.getAttribute('data-nombre');
      const cantidad = +cantidadNumerosInput.value;
      let texto = `Cantidad de ${nombre}`;
      if (cantidad > 1) {
        texto += 's';
      }
      labelCantidad.textContent = texto;
    }

    selectJuego.addEventListener('change', actualizarEtiqueta);
    cantidadNumerosInput.addEventListener('input', actualizarEtiqueta);
    actualizarEtiqueta();

    modoCalculo.addEventListener('change', () => {
      campoMartingala.style.display = (modoCalculo.value === 'martingala') ? 'block' : 'none';
      document.getElementById('martingala').required = (modoCalculo.value === 'martingala');
    });
    campoMartingala.style.display = (modoCalculo.value === 'martingala') ? 'block' : 'none';
    document.getElementById('martingala').required = (modoCalculo.value === 'martingala');

    const formulario = document.getElementById('formulario');

    const formato = num => num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    
    // Función para formatear con peso/pesos
    const formatoConPeso = num => {
      const montoFormateado = formato(num);
      const palabra = num === 1 ? 'peso' : 'pesos';
      return `$${montoFormateado} ${palabra}`;
    };

    // Función para guardar datos en localStorage
    function guardarDatos() {
      const datos = {
        dias: document.getElementById('dias').value,
        tipoJuego: selectJuego.value,
        martingala: document.getElementById('martingala').value,
        cantidadNumeros: cantidadNumerosInput.value,
        cantidadLoterias: document.getElementById('cantidadLoterias').value,
        montoInicial: document.getElementById('montoInicial').value,
        modo: modoCalculo.value
      };
      localStorage.setItem('datosLoteria', JSON.stringify(datos));
    }

    // Función para cargar datos del localStorage
    function cargarDatos() {
      const datosGuardados = localStorage.getItem('datosLoteria');
      if (datosGuardados) {
        try {
          const datos = JSON.parse(datosGuardados);
          if (datos.dias) document.getElementById('dias').value = datos.dias;
          if (datos.tipoJuego) selectJuego.value = datos.tipoJuego;
          if (datos.martingala) document.getElementById('martingala').value = datos.martingala;
          if (datos.cantidadNumeros) cantidadNumerosInput.value = datos.cantidadNumeros;
          if (datos.cantidadLoterias) document.getElementById('cantidadLoterias').value = datos.cantidadLoterias;
          if (datos.montoInicial) document.getElementById('montoInicial').value = datos.montoInicial;
          if (datos.modo) modoCalculo.value = datos.modo;
          
          // Actualizar la interfaz
          actualizarEtiqueta();
          campoMartingala.style.display = (modoCalculo.value === 'martingala') ? 'block' : 'none';
          document.getElementById('martingala').required = (modoCalculo.value === 'martingala');
        } catch (error) {
          console.error('Error al cargar datos guardados:', error);
        }
      }
    }

    // Función para guardar resultados en localStorage
    function guardarResultados(resumenHTML, tablaHTML) {
      const resultados = {
        resumen: resumenHTML,
        tabla: tablaHTML,
        fecha: new Date().toISOString()
      };
      localStorage.setItem('resultadosLoteria', JSON.stringify(resultados));
    }

    // Función para cargar resultados del localStorage
    function cargarResultados() {
      const resultadosGuardados = localStorage.getItem('resultadosLoteria');
      if (resultadosGuardados) {
        try {
          const resultados = JSON.parse(resultadosGuardados);
          document.getElementById('resumenCapital').innerHTML = resultados.resumen;
          document.getElementById('tablaResultados').innerHTML = resultados.tabla;
          document.getElementById('resultado').classList.remove('hidden');
        } catch (error) {
          console.error('Error al cargar resultados guardados:', error);
        }
      }
    }

    // Función para limpiar todo (nuevo cálculo)
    function nuevoCalculo() {
      // Limpiar campos del formulario
      document.getElementById('dias').value = '';
      selectJuego.value = '72';
      document.getElementById('martingala').value = '';
      cantidadNumerosInput.value = '';
      document.getElementById('cantidadLoterias').value = '';
      document.getElementById('montoInicial').value = '1';
      modoCalculo.value = 'martingala';
      
      // Actualizar interfaz
      actualizarEtiqueta();
      campoMartingala.style.display = 'block';
      document.getElementById('martingala').required = true;
      
      // Ocultar resultados
      document.getElementById('resultado').classList.add('hidden');
      
      // Limpiar localStorage
      localStorage.removeItem('datosLoteria');
      localStorage.removeItem('resultadosLoteria');
    }

    // Event listener para el botón "Nuevo Cálculo"
    btnNuevoCalculo.addEventListener('click', nuevoCalculo);

    // Guardar datos cuando cambien los campos
    document.getElementById('dias').addEventListener('input', guardarDatos);
    selectJuego.addEventListener('change', guardarDatos);
    document.getElementById('martingala').addEventListener('input', guardarDatos);
    cantidadNumerosInput.addEventListener('input', guardarDatos);
    document.getElementById('cantidadLoterias').addEventListener('input', guardarDatos);
    document.getElementById('montoInicial').addEventListener('input', guardarDatos);
    modoCalculo.addEventListener('change', guardarDatos);

    formulario.addEventListener('submit', e => {
      e.preventDefault();

      const datos = {
        dias: +document.getElementById('dias').value,
        tipoJuego: +selectJuego.value,
        martingala: +document.getElementById('martingala').value,
        montoInicial: +document.getElementById('montoInicial').value,
        cantidadNumeros: +cantidadNumerosInput.value,
        cantidadLoterias: +document.getElementById('cantidadLoterias').value,
        modo: modoCalculo.value
      };

      let inversionTotal = 0;
      let gananciaInicialNeta = datos.tipoJuego * datos.montoInicial - datos.montoInicial * datos.cantidadNumeros * datos.cantidadLoterias;

      let tablaHTML = '';

      for (let i = 1; i <= datos.dias; i++) {
        let montoJugada = datos.montoInicial;
        let inversionDia, gananciaBruta, gananciaNeta, gananciaEsperada, diferencia;

        if (datos.modo === 'martingala') {
          montoJugada = datos.montoInicial * Math.pow(datos.martingala, i - 1);
          inversionDia = montoJugada * datos.cantidadNumeros * datos.cantidadLoterias;
          inversionTotal += inversionDia;
          gananciaBruta = datos.tipoJuego * montoJugada;
          gananciaNeta = gananciaBruta - inversionTotal;
          gananciaEsperada = '-';
          diferencia = '-';
        } else {
          gananciaEsperada = gananciaInicialNeta * i;
          let mejorAjuste = { monto: 0, diferencia: Infinity, inversion: 0, gananciaNeta: 0 };
          const incremento = (datos.montoInicial % 1 === 0) ? 1 : 0.01;
          while (true) {
            let inversionTemp = montoJugada * datos.cantidadNumeros * datos.cantidadLoterias;
            let gananciaBrutaTemp = datos.tipoJuego * montoJugada;
            let gananciaNetaTemp = gananciaBrutaTemp - (inversionTotal + inversionTemp);
            let diferenciaTemp = Math.abs(gananciaNetaTemp - gananciaEsperada);
            if (diferenciaTemp < mejorAjuste.diferencia) {
              mejorAjuste = {
                monto: montoJugada,
                diferencia: diferenciaTemp,
                inversion: inversionTemp,
                gananciaNeta: gananciaNetaTemp
              };
            } else {
              break;
            }
            montoJugada = +(montoJugada + incremento).toFixed(2);
          }
          montoJugada = mejorAjuste.monto;
          inversionDia = mejorAjuste.inversion;
          inversionTotal += inversionDia;
          gananciaBruta = datos.tipoJuego * montoJugada;
          gananciaNeta = mejorAjuste.gananciaNeta;
          const diferenciaValor = gananciaNeta - gananciaEsperada;
          
          // Ajuste para el formato de la diferencia
          if (Math.abs(diferenciaValor) < 0.01) {
            diferencia = formatoConPeso(0);
          } else {
            const valorAbsoluto = Math.abs(diferenciaValor);
            const palabraPeso = valorAbsoluto === 1 ? 'peso' : 'pesos';
            diferencia = `$${formato(valorAbsoluto)} ${palabraPeso} ${diferenciaValor >= 0 ? 'más' : 'menos'} de lo esperado`;
          }
        }

        // Construcción del HTML según el modo
        let listaItems = `
          <li><strong>Monto a jug. a cada número:</strong> ${formatoConPeso(montoJugada)}</li>
          <li><strong>Inversión de hoy:</strong> ${formatoConPeso(inversionDia)}</li>
          <li><strong>Inversión total acumulada:</strong> ${formatoConPeso(inversionTotal)}</li>
          <li><strong>Ganancia bruta:</strong> ${formatoConPeso(gananciaBruta)}</li>
          <li><strong>Ganancia neta:</strong> ${formatoConPeso(gananciaNeta)}</li>
        `;

        // Solo agregar "Ganancia esperada" y "Diferencia" si NO es modo martingala
        if (datos.modo !== 'martingala') {
          listaItems += `
            <li><strong>Ganancia esperada:</strong> ${formatoConPeso(gananciaEsperada)}</li>
            <li><strong>Diferencia:</strong> ${diferencia}</li>
          `;
        }

        tablaHTML += `
          <div class="p-4 border-l-8 border-teal-400 bg-gray-700 rounded-xl shadow-md">
            <h3 class="text-2xl font-extrabold text-teal-300 mb-2">Día ${i}</h3>
            <ul class="space-y-1">
              ${listaItems}
            </ul>
          </div>
        `;
      }

      const resumenHTML = `Necesitarás un capital mínimo de <span class="font-bold text-teal-400">${formatoConPeso(inversionTotal)}</span> para jugar durante <span class="font-bold">${datos.dias}</span> días.`;
      
      document.getElementById('resumenCapital').innerHTML = resumenHTML;
      document.getElementById('tablaResultados').innerHTML = tablaHTML;
      document.getElementById('resultado').classList.remove('hidden');
      
      // Guardar resultados en localStorage
      guardarResultados(resumenHTML, tablaHTML);
    });

    // Cargar datos y resultados al iniciar la página
    cargarDatos();
    cargarResultados();
  </script>
</body>
</html>
